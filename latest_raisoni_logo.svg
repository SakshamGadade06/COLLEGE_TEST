<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 145" width="560" height="145">
  <defs>
    <style>
      .r-brand { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #4a157e; }
      .r-college { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; fill: #f25700; letter-spacing: 0.12em; }
      .r-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #334155; font-size: 20px; letter-spacing: 0.02em; }
      .r-pune { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #f25700; font-size: 19px; }
    </style>
  </defs>
  <!-- Lion Emblem -->
  <image href="data:image/webp;base64," x="10" y="8" width="95" height="128" preserveAspectRatio="xMidYMid meet"/>
  
  <!-- G H raisoni -->
  <text x="120" y="46" class="r-brand" font-size="44">G H raisoni</text>
  
  <!-- COLLEGE -->
  <text x="122" y="80" class="r-college" font-size="30">COLLEGE</text>
  
  <!-- Purple Accent Line -->
  <line x1="122" y1="92" x2="540" y2="92" stroke="#4a157e" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Subtitle -->
  <text x="122" y="116" class="r-sub">Engineering &amp; Management</text>
  <text x="122" y="137" class="r-pune">Pune <tspan fill="#64748b" font-size="14px" font-weight="600">(Autonomous Institute)</tspan></text>
</svg>